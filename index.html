<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本影、半影與偽本影 模擬網頁</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            margin-bottom: 10px;
            color: #4da6ff;
        }
        p.desc {
            margin-bottom: 20px;
            color: #aaa;
            text-align: center;
            max-width: 850px;
            line-height: 1.5;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }
        canvas {
            background-color: #050508;
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            cursor: pointer;
        }
        .controls {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 14px;
            color: #ddd;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #4da6ff;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 5px;
            font-size: 14px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .color-box {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }
        .view-panel {
            display: flex;
            align-items: center;
            gap: 20px;
            background-color: #181818;
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        #eclipseCanvas {
            background-color: #000;
            border-radius: 50%;
            border: 2px solid #555;
        }
    </style>
</head>
<body>

    <h1>本影、半影與偽本影</h1>
    <p class="desc">

        • <b>紅色實線</b>：頂點至頂點，定義<b>本影</b>與<b>偽本影</b>。<br>
        • <b>黃色虛線</b>：光源上連至障礙物下、光源下連至障礙物上，邊界外側即為<b>半影區</b>。<br>
        • 調整<b>「觀測點垂直高度 (Y)」</b>，將觀測點移至黃色的<b>半影區</b>，下方視角即可觀察到<b>偏食</b>。
    </p>

    <div class="container">
        <canvas id="simCanvas" width="850" height="380"></canvas>

        <div class="legend">
            <div class="legend-item">
                <div class="color-box" style="background-color: rgba(255, 50, 50, 0.4); border: 1px solid red;"></div>
                <span>本影區 (Umbra)</span>
            </div>
            <div class="legend-item">
                <div class="color-box" style="background-color: rgba(0, 180, 255, 0.4); border: 1px solid cyan;"></div>
                <span>偽本影區 (Antumbra)</span>
            </div>
            <div class="legend-item">
                <div class="color-box" style="background-color: rgba(255, 255, 100, 0.2); border: 1px solid yellow;"></div>
                <span>半影區 (Penumbra)</span>
            </div>
        </div>

        <div class="view-panel">
            <canvas id="eclipseCanvas" width="100" height="100"></canvas>
            <div>
                <h3 style="color: #4da6ff; margin-bottom: 5px;">觀測點視角 (綠色標記處)</h3>
                <p id="eclipseStatus" style="color: #ccc; font-size: 14px;">顯示該觀測點看過去的光源被遮擋狀況</p>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label id="lightSizeLabel">光源大小: 60px</label>
                <input type="range" id="lightSize" min="15" max="90" value="60">
            </div>
            <div class="control-group">
                <label id="objSizeLabel">障礙物大小: 25px</label>
                <input type="range" id="objSize" min="10" max="60" value="25">
            </div>
            <div class="control-group">
                <label id="screenXLabel">螢幕位置 (X): 750px</label>
                <input type="range" id="screenXInput" min="400" max="830" value="750">
            </div>
            <div class="control-group">
                <label id="screenYLabel">觀測點高度 (Y): 190px</label>
                <input type="range" id="screenYInput" min="20" max="360" value="190">
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const eclipseCanvas = document.getElementById('eclipseCanvas');
        const eCtx = eclipseCanvas.getContext('2d');

        const lightSizeInput = document.getElementById('lightSize');
        const objSizeInput = document.getElementById('objSize');
        const screenXInput = document.getElementById('screenXInput');
        const screenYInput = document.getElementById('screenYInput');

        const lightSizeLabel = document.getElementById('lightSizeLabel');
        const objSizeLabel = document.getElementById('objSizeLabel');
        const screenXLabel = document.getElementById('screenXLabel');
        const screenYLabel = document.getElementById('screenYLabel');
        const eclipseStatus = document.getElementById('eclipseStatus');

        let light = { x: 120, y: 190, r: 60 };
        let obstacle = { x: 380, y: 190, r: 25 };
        let screenX = 750;
        let obsY = 190; // 螢幕上的觀測點 Y 座標

        let isDragging = null;

        lightSizeInput.addEventListener('input', (e) => {
            light.r = parseInt(e.target.value);
            lightSizeLabel.innerText = `光源大小: ${light.r}px`;
            draw();
        });

        objSizeInput.addEventListener('input', (e) => {
            obstacle.r = parseInt(e.target.value);
            objSizeLabel.innerText = `障礙物大小: ${obstacle.r}px`;
            draw();
        });

        screenXInput.addEventListener('input', (e) => {
            screenX = parseInt(e.target.value);
            screenXLabel.innerText = `螢幕位置 (X): ${screenX}px`;
            draw();
        });

        screenYInput.addEventListener('input', (e) => {
            obsY = parseInt(e.target.value);
            screenYLabel.innerText = `觀測點高度 (Y): ${obsY}px`;
            draw();
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (Math.hypot(mouseX - light.x, mouseY - light.y) < light.r + 10) {
                isDragging = 'light';
            } else if (Math.hypot(mouseX - obstacle.x, mouseY - obstacle.y) < obstacle.r + 10) {
                isDragging = 'obstacle';
            } else if (Math.abs(mouseX - screenX) < 15) {
                // 如果點擊靠近觀測點十字，拖曳 Y
                if (Math.abs(mouseY - obsY) < 20) {
                    isDragging = 'obsPoint';
                } else {
                    isDragging = 'screen';
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (isDragging === 'light') {
                light.x = Math.min(Math.max(light.r, mouseX), obstacle.x - obstacle.r - 30);
            } else if (isDragging === 'obstacle') {
                obstacle.x = Math.min(Math.max(light.x + light.r + 30, mouseX), screenX - 30);
            } else if (isDragging === 'screen') {
                screenX = Math.min(Math.max(obstacle.x + obstacle.r + 20, mouseX), canvas.width - 20);
                screenXInput.value = screenX;
                screenXLabel.innerText = `螢幕位置 (X): ${screenX}px`;
            } else if (isDragging === 'obsPoint') {
                obsY = Math.min(Math.max(10, mouseY), canvas.height - 10);
                screenYInput.value = obsY;
                screenYLabel.innerText = `觀測點高度 (Y): ${obsY}px`;
            }
            draw();
        });

        window.addEventListener('mouseup', () => { isDragging = null; });

        function getRayPointAtX(p1, p2, targetX) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            if (dx === 0) return { x: targetX, y: p1.y };
            const t = (targetX - p1.x) / dx;
            return { x: targetX, y: p1.y + t * dy };
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const d = obstacle.x - light.x; 
            const maxX = canvas.width;

            // 1. 計算【外公切線】
            const sinAlpha = (light.r - obstacle.r) / d;
            const cosAlpha = Math.sqrt(Math.max(0, 1 - sinAlpha * sinAlpha));

            const lightOuterTop = { x: light.x + light.r * sinAlpha, y: light.y - light.r * cosAlpha };
            const obsOuterTop   = { x: obstacle.x + obstacle.r * sinAlpha, y: obstacle.y - obstacle.r * cosAlpha };

            const lightOuterBot = { x: light.x + light.r * sinAlpha, y: light.y + light.r * cosAlpha };
            const obsOuterBot   = { x: obstacle.x + obstacle.r * sinAlpha, y: obstacle.y + obstacle.r * cosAlpha };

            const outerTopEnd = getRayPointAtX(lightOuterTop, obsOuterTop, maxX);
            const outerBotEnd = getRayPointAtX(lightOuterBot, obsOuterBot, maxX);

            let apexX = maxX + 1000;
            if (light.r > obstacle.r) {
                apexX = light.x + (light.r * d) / (light.r - obstacle.r);
            }

            // 2. 計算【內公切線 / 交叉線】
            const sinBeta = (light.r + obstacle.r) / d;
            const cosBeta = Math.sqrt(Math.max(0, 1 - sinBeta * sinBeta));

            const lightInnerTop = { x: light.x - light.r * sinBeta, y: light.y - light.r * cosBeta };
            const obsInnerBot   = { x: obstacle.x + obstacle.r * sinBeta, y: obstacle.y + obstacle.r * cosBeta };

            const lightInnerBot = { x: light.x - light.r * sinBeta, y: light.y + light.r * cosBeta };
            const obsInnerTop   = { x: obstacle.x + obstacle.r * sinBeta, y: obstacle.y - obstacle.r * cosBeta };

            const innerBotEnd = getRayPointAtX(lightInnerTop, obsInnerBot, maxX);
            const innerTopEnd = getRayPointAtX(lightInnerBot, obsInnerTop, maxX);

            // 3. 繪製【影子區域色彩】
            // A. 半影區 (Penumbra)
            ctx.fillStyle = 'rgba(255, 255, 100, 0.18)';
            ctx.beginPath();
            ctx.moveTo(obsOuterTop.x, obsOuterTop.y);
            ctx.lineTo(outerTopEnd.x, outerTopEnd.y);
            ctx.lineTo(innerTopEnd.x, innerTopEnd.y);
            ctx.lineTo(obsInnerTop.x, obsInnerTop.y);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(obsOuterBot.x, obsOuterBot.y);
            ctx.lineTo(outerBotEnd.x, outerBotEnd.y);
            ctx.lineTo(innerBotEnd.x, innerBotEnd.y);
            ctx.lineTo(obsInnerBot.x, obsInnerBot.y);
            ctx.closePath();
            ctx.fill();

            // B. 本影區 (Umbra)
            if (light.r > obstacle.r) {
                ctx.fillStyle = 'rgba(255, 50, 50, 0.4)';
                ctx.beginPath();
                ctx.moveTo(obsOuterTop.x, obsOuterTop.y);
                if (apexX <= maxX) {
                    ctx.lineTo(apexX, light.y);
                } else {
                    ctx.lineTo(outerTopEnd.x, outerTopEnd.y);
                    ctx.lineTo(outerBotEnd.x, outerBotEnd.y);
                }
                ctx.lineTo(obsOuterBot.x, obsOuterBot.y);
                ctx.closePath();
                ctx.fill();

                // C. 偽本影區 (Antumbra)
                if (apexX < maxX) {
                    ctx.fillStyle = 'rgba(0, 180, 255, 0.4)';
                    ctx.beginPath();
                    ctx.moveTo(apexX, light.y);
                    ctx.lineTo(outerTopEnd.x, outerTopEnd.y);
                    ctx.lineTo(outerBotEnd.x, outerBotEnd.y);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            // 4. 繪製【切線結構線】
            ctx.lineWidth = 1.2;
            ctx.strokeStyle = 'rgba(255, 80, 80, 0.9)';
            ctx.beginPath();
            ctx.moveTo(lightOuterTop.x, lightOuterTop.y);
            ctx.lineTo(outerTopEnd.x, outerTopEnd.y);
            ctx.moveTo(lightOuterBot.x, lightOuterBot.y);
            ctx.lineTo(outerBotEnd.x, outerBotEnd.y);
            ctx.stroke();

            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = 'rgba(255, 255, 120, 0.9)';
            ctx.beginPath();
            ctx.moveTo(lightInnerTop.x, lightInnerTop.y);
            ctx.lineTo(innerBotEnd.x, innerBotEnd.y);
            ctx.moveTo(lightInnerBot.x, lightInnerBot.y);
            ctx.lineTo(innerTopEnd.x, innerTopEnd.y);
            ctx.stroke();
            ctx.setLineDash([]);

            // 5. 繪製螢幕與觀測點
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(screenX - 2, 0, 4, canvas.height);
            ctx.fillText("螢幕", screenX - 10, canvas.height - 10);

            // 在螢幕上繪製綠色觀測點十字 (觀測點)
            ctx.strokeStyle = '#00ff66';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(screenX, obsY, 6, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = '#00ff66';
            ctx.fillText("觀測點", screenX - 45, obsY + 4);

            // 光源與障礙物
            ctx.beginPath();
            ctx.arc(light.x, light.y, light.r, 0, Math.PI * 2);
            ctx.fillStyle = '#ffea75';
            ctx.shadowColor = '#ffea75';
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#000';
            ctx.textAlign = 'center';
            ctx.fillText("光源", light.x, light.y + 4);

            ctx.beginPath();
            ctx.arc(obstacle.x, obstacle.y, obstacle.r, 0, Math.PI * 2);
            ctx.fillStyle = '#444';
            ctx.strokeStyle = '#aaa';
            ctx.lineWidth = 2;
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.fillText("障礙物", obstacle.x, obstacle.y + 4);

            updateEclipseView();
        }

        // 準確計算從觀測點 (screenX, obsY) 看過去的角度與視徑
        function updateEclipseView() {
            eCtx.clearRect(0, 0, eclipseCanvas.width, eclipseCanvas.height);

            const obsPt = { x: screenX, y: obsY };

            // 觀測點至光源中心與障礙物中心的距離與向量
            const dxL = light.x - obsPt.x;
            const dyL = light.y - obsPt.y;
            const distL = Math.hypot(dxL, dyL);

            const dxO = obstacle.x - obsPt.x;
            const dyO = obstacle.y - obsPt.y;
            const distO = Math.hypot(dxO, dyO);

            // 計算視半徑 (Apparent Radius)
            const appR_light = (light.r / distL) * 350;
            const appR_obs = (obstacle.r / distO) * 350;

            // 計算兩者中心在視角平面上的相對偏離量 (Offset)
            const angleL = Math.atan2(dyL, dxL);
            const angleO = Math.atan2(dyO, dxO);
            let dAngle = angleO - angleL;

            // 視角轉換為 2D 小圓畫布像素點
            const scale = 350;
            const offsetCanvasX = Math.cos(dAngle) * distO * (scale / distO) - scale; 
            const offsetCanvasY = Math.sin(dAngle) * scale;

            const cxL = 50, cyL = 50;
            const cxO = cxL + offsetCanvasX;
            const cyO = cyL + offsetCanvasY;

            // 繪製太陽 (光源)
            eCtx.beginPath();
            eCtx.arc(cxL, cyL, appR_light, 0, Math.PI * 2);
            eCtx.fillStyle = '#ffea75';
            eCtx.fill();

            // 繪製月球 (障礙物)
            eCtx.beginPath();
            eCtx.arc(cxO, cyO, appR_obs, 0, Math.PI * 2);
            eCtx.fillStyle = '#111111';
            eCtx.fill();
            eCtx.strokeStyle = '#666';
            eCtx.lineWidth = 1;
            eCtx.stroke();

            // 計算兩圓心距離以判定食象
            const centerDist = Math.hypot(cxO - cxL, cyO - cyL);

            if (centerDist >= appR_light + appR_obs) {
                eclipseStatus.innerHTML = "<b style='color:#00ff66;'>【偏食外 / 未偏食】</b><br>觀測點處於完全亮區，太陽未被遮擋。";
            } else if (centerDist + appR_obs <= appR_light && appR_obs < appR_light) {
                eclipseStatus.innerHTML = "<b style='color:#00d2ff;'>【偽本影區 - 環食】</b><br>障礙物完全浸入光源視角內，形成光環。";
            } else if (centerDist + appR_light <= appR_obs) {
                eclipseStatus.innerHTML = "<b style='color:#ff4d4d;'>【本影區 - 全食】</b><br>光源被完全遮蔽，出現日全食。";
            } else {
                eclipseStatus.innerHTML = "<b style='color:#ffaa00;'>【半影區 - 偏食】</b><br>障礙物遮擋部分光源，呈現缺角的<b>日偏食</b>！";
            }
        }

        draw();
    </script>
</body>
</html>
