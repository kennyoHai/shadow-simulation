<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本影、半影與偽本影 模擬網頁 (幾何修復版)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            margin-bottom: 10px;
            color: #4da6ff;
        }
        p.desc {
            margin-bottom: 20px;
            color: #aaa;
            text-align: center;
            max-width: 850px;
            line-height: 1.5;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }
        canvas {
            background-color: #050508;
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            cursor: pointer;
        }
        .controls {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 14px;
            color: #ddd;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #4da6ff;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 5px;
            font-size: 14px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .color-box {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }
        .view-panel {
            display: flex;
            align-items: center;
            gap: 20px;
            background-color: #181818;
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        #eclipseCanvas {
            background-color: #000;
            border-radius: 50%;
            border: 2px solid #555;
        }
    </style>
</head>
<body>

    <h1>本影、半影與偽本影</h1>
    <p class="desc">
        
        • <b>紅色實線</b>：頂點至頂點，定義<b>本影 Cone</b>與<b>偽本影 Cone</b>。<br>
        • <b>黃色虛線</b>：光源上連至障礙物下、光源下連至障礙物上，邊界外側即為<b>半影區</b>。
    </p>

    <div class="container">
        <canvas id="simCanvas" width="850" height="380"></canvas>

        <div class="legend">
            <div class="legend-item">
                <div class="color-box" style="background-color: rgba(255, 50, 50, 0.4); border: 1px solid red;"></div>
                <span>本影區 (Umbra)</span>
            </div>
            <div class="legend-item">
                <div class="color-box" style="background-color: rgba(0, 180, 255, 0.4); border: 1px solid cyan;"></div>
                <span>偽本影區 (Antumbra)</span>
            </div>
            <div class="legend-item">
                <div class="color-box" style="background-color: rgba(255, 255, 100, 0.2); border: 1px solid yellow;"></div>
                <span>半影區 (Penumbra)</span>
            </div>
        </div>

        <div class="view-panel">
            <canvas id="eclipseCanvas" width="100" height="100"></canvas>
            <div>
                <h3 style="color: #4da6ff; margin-bottom: 5px;">螢幕中心點視角</h3>
                <p id="eclipseStatus" style="color: #ccc; font-size: 14px;">顯示從螢幕中央向光源看過去的遮檔情況</p>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label id="lightSizeLabel">光源大小: 60px</label>
                <input type="range" id="lightSize" min="15" max="90" value="60">
            </div>
            <div class="control-group">
                <label id="objSizeLabel">障礙物大小: 25px</label>
                <input type="range" id="objSize" min="10" max="60" value="25">
            </div>
            <div class="control-group">
                <label id="screenXLabel">螢幕位置 (X): 750px</label>
                <input type="range" id="screenXInput" min="400" max="830" value="750">
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const eclipseCanvas = document.getElementById('eclipseCanvas');
        const eCtx = eclipseCanvas.getContext('2d');

        const lightSizeInput = document.getElementById('lightSize');
        const objSizeInput = document.getElementById('objSize');
        const screenXInput = document.getElementById('screenXInput');

        const lightSizeLabel = document.getElementById('lightSizeLabel');
        const objSizeLabel = document.getElementById('objSizeLabel');
        const screenXLabel = document.getElementById('screenXLabel');
        const eclipseStatus = document.getElementById('eclipseStatus');

        let light = { x: 120, y: 190, r: 60 };
        let obstacle = { x: 380, y: 190, r: 25 };
        let screenX = 750;

        let isDragging = null;

        lightSizeInput.addEventListener('input', (e) => {
            light.r = parseInt(e.target.value);
            lightSizeLabel.innerText = `光源大小: ${light.r}px`;
            draw();
        });

        objSizeInput.addEventListener('input', (e) => {
            obstacle.r = parseInt(e.target.value);
            objSizeLabel.innerText = `障礙物大小: ${obstacle.r}px`;
            draw();
        });

        screenXInput.addEventListener('input', (e) => {
            screenX = parseInt(e.target.value);
            screenXLabel.innerText = `螢幕位置 (X): ${screenX}px`;
            draw();
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (Math.hypot(mouseX - light.x, mouseY - light.y) < light.r + 10) {
                isDragging = 'light';
            } else if (Math.hypot(mouseX - obstacle.x, mouseY - obstacle.y) < obstacle.r + 10) {
                isDragging = 'obstacle';
            } else if (Math.abs(mouseX - screenX) < 15) {
                isDragging = 'screen';
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (isDragging === 'light') {
                light.x = Math.min(Math.max(light.r, mouseX), obstacle.x - obstacle.r - 30);
            } else if (isDragging === 'obstacle') {
                obstacle.x = Math.min(Math.max(light.x + light.r + 30, mouseX), screenX - 30);
            } else if (isDragging === 'screen') {
                screenX = Math.min(Math.max(obstacle.x + obstacle.r + 20, mouseX), canvas.width - 20);
                screenXInput.value = screenX;
                screenXLabel.innerText = `螢幕位置 (X): ${screenX}px`;
            }
            draw();
        });

        window.addEventListener('mouseup', () => { isDragging = null; });

        // 兩點連線延伸至目標 X 座標
        function getRayPointAtX(p1, p2, targetX) {
            const dx = p2.x - p1.x;
            const dy = p2.y - p1.y;
            if (dx === 0) return { x: targetX, y: p1.y };
            const t = (targetX - p1.x) / dx;
            return { x: targetX, y: p1.y + t * dy };
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const d = obstacle.x - light.x; 
            const maxX = canvas.width;

            // 1. 計算【外公切線】(紅色實線: 本影 & 偽本影)
            // sin(alpha) = (R - r) / d
            const sinAlpha = (light.r - obstacle.r) / d;
            const cosAlpha = Math.sqrt(Math.max(0, 1 - sinAlpha * sinAlpha));

            const lightOuterTop = { x: light.x + light.r * sinAlpha, y: light.y - light.r * cosAlpha };
            const obsOuterTop   = { x: obstacle.x + obstacle.r * sinAlpha, y: obstacle.y - obstacle.r * cosAlpha };

            const lightOuterBot = { x: light.x + light.r * sinAlpha, y: light.y + light.r * cosAlpha };
            const obsOuterBot   = { x: obstacle.x + obstacle.r * sinAlpha, y: obstacle.y + obstacle.r * cosAlpha };

            const outerTopEnd = getRayPointAtX(lightOuterTop, obsOuterTop, maxX);
            const outerBotEnd = getRayPointAtX(lightOuterBot, obsOuterBot, maxX);

            // 本影頂點 (Apex)
            let apexX = maxX + 1000;
            if (light.r > obstacle.r) {
                apexX = light.x + (light.r * d) / (light.r - obstacle.r);
            }

            // 2. 計算【內公切線 / 交叉線】(黃色虛線: 半影外邊界)
            // sin(beta) = (R + r) / d
            const sinBeta = (light.r + obstacle.r) / d;
            const cosBeta = Math.sqrt(Math.max(0, 1 - sinBeta * sinBeta));

            // 交叉 1: 光源【上切點】 -> 障礙物【下切點】
            const lightInnerTop = { x: light.x - light.r * sinBeta, y: light.y - light.r * cosBeta };
            const obsInnerBot   = { x: obstacle.x + obstacle.r * sinBeta, y: obstacle.y + obstacle.r * cosBeta };

            // 交叉 2: 光源【下切點】 -> 障礙物【上切點】
            const lightInnerBot = { x: light.x - light.r * sinBeta, y: light.y + light.r * cosBeta };
            const obsInnerTop   = { x: obstacle.x + obstacle.r * sinBeta, y: obstacle.y - obstacle.r * cosBeta };

            // 交叉內切線延伸至畫布最右側
            // 注意：lightInnerTop 經由 obsInnerBot 延伸後會發散到【畫布下方】
            const innerBotEnd = getRayPointAtX(lightInnerTop, obsInnerBot, maxX);
            // 注意：lightInnerBot 經由 obsInnerTop 延伸後會發散到【畫布上方】
            const innerTopEnd = getRayPointAtX(lightInnerBot, obsInnerTop, maxX);


            // 3. 繪製【影子區域色彩】

            // A. 半影區 (Penumbra) - 夾在黃色交叉延伸線與紅色外切線之間
            ctx.fillStyle = 'rgba(255, 255, 100, 0.18)';
            
            // 上半半影：從障礙物上邊界開展 (界於紅色 outerTop 與 黃色 innerTop 之間)
            ctx.beginPath();
            ctx.moveTo(obsOuterTop.x, obsOuterTop.y);
            ctx.lineTo(outerTopEnd.x, outerTopEnd.y);
            ctx.lineTo(innerTopEnd.x, innerTopEnd.y);
            ctx.lineTo(obsInnerTop.x, obsInnerTop.y);
            ctx.closePath();
            ctx.fill();

            // 下半半影：從障礙物下邊界開展 (界於紅色 outerBot 與 黃色 innerBot 之間)
            ctx.beginPath();
            ctx.moveTo(obsOuterBot.x, obsOuterBot.y);
            ctx.lineTo(outerBotEnd.x, outerBotEnd.y);
            ctx.lineTo(innerBotEnd.x, innerBotEnd.y);
            ctx.lineTo(obsInnerBot.x, obsInnerBot.y);
            ctx.closePath();
            ctx.fill();

            // B. 本影區 (Umbra)
            if (light.r > obstacle.r) {
                ctx.fillStyle = 'rgba(255, 50, 50, 0.4)';
                ctx.beginPath();
                ctx.moveTo(obsOuterTop.x, obsOuterTop.y);
                if (apexX <= maxX) {
                    ctx.lineTo(apexX, light.y);
                } else {
                    ctx.lineTo(outerTopEnd.x, outerTopEnd.y);
                    ctx.lineTo(outerBotEnd.x, outerBotEnd.y);
                }
                ctx.lineTo(obsOuterBot.x, obsOuterBot.y);
                ctx.closePath();
                ctx.fill();

                // C. 偽本影區 (Antumbra) - 本影頂點往後的反向錐形
                if (apexX < maxX) {
                    ctx.fillStyle = 'rgba(0, 180, 255, 0.4)';
                    ctx.beginPath();
                    ctx.moveTo(apexX, light.y);
                    ctx.lineTo(outerTopEnd.x, outerTopEnd.y);
                    ctx.lineTo(outerBotEnd.x, outerBotEnd.y);
                    ctx.closePath();
                    ctx.fill();
                }
            }


            // 4. 繪製【切線結構線】
            ctx.lineWidth = 1.2;

            // [紅色實線] 外公切線：定義本影與偽本影
            ctx.strokeStyle = 'rgba(255, 80, 80, 0.9)';
            ctx.beginPath();
            ctx.moveTo(lightOuterTop.x, lightOuterTop.y);
            ctx.lineTo(outerTopEnd.x, outerTopEnd.y);
            ctx.moveTo(lightOuterBot.x, lightOuterBot.y);
            ctx.lineTo(outerBotEnd.x, outerBotEnd.y);
            ctx.stroke();

            // [黃色虛線] 交叉內公切線：定義半影外界 (呈現 X 型交叉)
            ctx.setLineDash([5, 5]);
            ctx.strokeStyle = 'rgba(255, 255, 120, 0.9)';
            ctx.beginPath();
            // 交叉線 1: 光源上 -> 障礙物下 -> 延伸至下方右側
            ctx.moveTo(lightInnerTop.x, lightInnerTop.y);
            ctx.lineTo(innerBotEnd.x, innerBotEnd.y);
            // 交叉線 2: 光源下 -> 障礙物上 -> 延伸至上方右側
            ctx.moveTo(lightInnerBot.x, lightInnerBot.y);
            ctx.lineTo(innerTopEnd.x, innerTopEnd.y);
            ctx.stroke();

            ctx.setLineDash([]); // 恢復實線

            // 標示本影頂點 (Apex)
            if (light.r > obstacle.r && apexX < maxX) {
                ctx.fillStyle = '#ff3333';
                ctx.beginPath();
                ctx.arc(apexX, light.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText("本影頂點", apexX, light.y - 10);
            }

            // 5. 繪製螢幕與實體物體
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(screenX - 2, 0, 4, canvas.height);
            ctx.fillText("螢幕", screenX - 10, canvas.height - 10);

            // 光源
            ctx.beginPath();
            ctx.arc(light.x, light.y, light.r, 0, Math.PI * 2);
            ctx.fillStyle = '#ffea75';
            ctx.shadowColor = '#ffea75';
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#000';
            ctx.textAlign = 'center';
            ctx.fillText("光源", light.x, light.y + 4);

            // 障礙物
            ctx.beginPath();
            ctx.arc(obstacle.x, obstacle.y, obstacle.r, 0, Math.PI * 2);
            ctx.fillStyle = '#444';
            ctx.strokeStyle = '#aaa';
            ctx.lineWidth = 2;
            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.fillText("障礙物", obstacle.x, obstacle.y + 4);

            updateEclipseView(apexX);
        }

        function updateEclipseView(apexX) {
            eCtx.clearRect(0, 0, eclipseCanvas.width, eclipseCanvas.height);
            const cx = 50, cy = 50;

            const distLight = screenX - light.x;
            const distObs = screenX - obstacle.x;

            const apparentLightR = (light.r / distLight) * 350;
            const apparentObsR = (obstacle.r / distObs) * 350;

            eCtx.beginPath();
            eCtx.arc(cx, cy, apparentLightR, 0, Math.PI * 2);
            eCtx.fillStyle = '#ffea75';
            eCtx.fill();

            eCtx.beginPath();
            eCtx.arc(cx, cy, apparentObsR, 0, Math.PI * 2);
            eCtx.fillStyle = '#111111';
            eCtx.fill();
            eCtx.strokeStyle = '#555';
            eCtx.stroke();

            if (screenX < apexX) {
                eclipseStatus.innerHTML = "<b style='color:#ff4d4d;'>【本影區 - 全食】</b><br>光源被完全遮擋，中央全黑。";
            } else if (Math.abs(screenX - apexX) < 5) {
                eclipseStatus.innerHTML = "<b style='color:#ffaa00;'>【本影頂點】</b><br>障礙物大小剛好等於光源。";
            } else {
                eclipseStatus.innerHTML = "<b style='color:#00d2ff;'>【偽本影區 - 環食】</b><br>障礙物視角小於光源，邊緣露出一圈光環。";
            }
        }

        draw();
    </script>
</body>
</html>
